[package]
name = "indexer_advanced"
version = "0.1.0"
edition = "2021"
description = "Advanced Blockchain Indexer with Full Trace Support"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ethers = "2.0"
# `ethers` disables its provider crate's default features, which drops the
# WebSocket transport. Depend on the provider crate directly to re-enable it so
# `ethers::providers::Ws` exists.
ethers-providers = { version = "2.0", features = ["ws", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
url = "2.4"
bytes = "1.5"
futures = "0.3"
parking_lot = "0.12"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
ethabi = "18"
ethbloom = "0.13"
keccak-hash = "0.1"
rlp = "0.5"
hex = "0.4"

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "indexer_advanced"
path = "src/lib.rs"
