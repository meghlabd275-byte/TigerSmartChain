[package]
name = "tiger-quantum"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Quantum-resistant cryptography for TigerScan"
license = "MIT"

[dependencies]
# Cryptography
sha3 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
log = "0.4"

# For lattice-based operations
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.7"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "quantum_bench"
harness = false

[profile.release]
opt-level = 3
lto = true