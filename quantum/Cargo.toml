[package]
name = "tiger-quantum"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Quantum-resistant cryptography for TigerScan"
license = "MIT"

[dependencies]
# Post-quantum primitives (NIST PQC standards)
pqc_dilithium = "0.2"
pqc_kyber = { version = "0.7", features = ["kyber768"] }
# Hashes and MACs
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
subtle = "2.5"
# Encoding and RNG
rand = "0.8"
hex = "0.4"
# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rayon = "1.7"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "quantum_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
