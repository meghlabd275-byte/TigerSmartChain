[package]
name = "tigersmartchaind"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "TigerSmartChain Node Daemon"
license = "MIT"

[[bin]]
name = "tigersmartchaind"
path = "src/main.rs"

[dependencies]
# Use existing TigerSmartChain crates
tiger-node = { path = "../../node" }
tiger-blockchain = { path = "../../blockchain" }
tiger-consensus = { path = "../../consensus" }
tiger-state = { path = "../../state" }
tiger-network = { path = "../../network" }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
anyhow = "1.0"

# Async
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1