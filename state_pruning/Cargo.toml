[package]
name = "state_pruning"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "State pruning backed by the real Merkle Patricia Trie"

[dependencies]
tiger-state = { path = "../state" }
tiger-crypto = { path = "../crypto" }
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
criterion = "0.5"

[features]
default = ["modern"]
modern = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
