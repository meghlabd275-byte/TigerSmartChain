[package]
name = "state_pruning"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "High-performance state pruning for EVM blockchain"

[dependencies]
rocksdb = "0.21"
ethereum-types = "0.14"
evm = "0.40"
keccak-hash = "0.10"
rlp = "0.5"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[features]
default = ["modern"]
modern = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
