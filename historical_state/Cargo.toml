[package]
name = "tiger-historical-state"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Historical state queries (eth_getProof, eth_getBalance, eth_getStorageAt) for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking"], default-features = false }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
