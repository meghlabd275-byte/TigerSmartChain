[package]
name = "tiger-internal-tx"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Internal Transaction for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sha3 = "0.10"
futures-util = "0.3"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true