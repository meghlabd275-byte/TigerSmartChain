[package]
name = "simulation_service"
version = "0.1.0"
edition = "2021"
description = "Transaction Simulation Service for TigerScan - Full simulation with state overrides"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rt-multi-thread"]
runtime-async = []

[package.metadata]
docs = "https://docs.tigerscan.io"