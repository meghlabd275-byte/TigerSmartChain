[package]
name = "tiger-simulation"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Transaction simulation for read/write contracts"
license = "MIT"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client for RPC calls
reqwest = { version = "0.11", features = ["json"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1