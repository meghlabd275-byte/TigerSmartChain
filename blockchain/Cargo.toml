[package]
name = "tiger-blockchain"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Blockchain for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"
tiger-crypto = { path = "../crypto" }
tiger-state = { path = "../state" }

[profile.release]
opt-level = 3
lto = true