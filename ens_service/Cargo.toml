[package]
name = "ens_service"
version = "0.1.0"
edition = "2021"
description = "ENS Resolution Service for TigerScan - .eth domain resolution"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
tokio::sync = "1.35"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rustls"]
runtime-async = []

[package.metadata]
docs = "https://docs.tigerscan.io"