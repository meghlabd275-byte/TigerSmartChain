[package]
name = "ens_service"
version = "0.1.0"
edition = "2021"
description = "ENS resolution service for TigerScan"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
sha3 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
