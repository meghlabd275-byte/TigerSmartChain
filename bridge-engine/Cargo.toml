[package]
name = "tigersmartchain-bridge"
version = "0.1.0"
edition = "2021"
description = "TigerSmartChain Bridge Engine - Cross-chain bridge with multi-chain support"

[dependencies]
ethers = { version = "2.0", features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
url = "2.0"
ethers-providers = "2.0"
ethers-contract = "2.0"
ethers-signers = "2.0"
ethers-core = "2.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.0"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
hex = "0.4"

[lib]
name = "tigersmartchain_bridge"
path = "src/lib.rs"

[[bin]]
name = "tigersmartchain-bridge"
path = "src/main.rs"

[features]
default = ["full"]
full = ["ethereum", "polygon", "arbitrum", "optimism", "base"]
ethereum = []
polygon = []
arbitrum = []
optimism = []
base = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1