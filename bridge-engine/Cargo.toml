[package]
name = "tigersmartchain-bridge"
version = "0.1.0"
edition = "2021"
description = "TigerSmartChain Bridge Engine - Cross-chain bridge with multi-chain support"

[dependencies]
ethers = { version = "2.0", features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
url = "2.0"
ethers-providers = "2.0"
ethers-contract = "2.0"

[dev-dependencies]
tempfile = "3.0"

[lib]
name = "tigersmartchain_bridge"
path = "src/lib.rs"

[[bin]]
name = "tigersmartchain-bridge"
path = "src/main.rs"

[features]
default = ["full"]
full = ["ethereum", "polygon", "arbitrum", "optimism", "base"]
ethereum = []
polygon = []
arbitrum = []
optimism = []
base = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1