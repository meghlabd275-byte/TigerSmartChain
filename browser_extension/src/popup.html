<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerSmartChain</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    
    .header {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo {
      font-size: 24px;
    }
    
    .header-text h1 {
      font-size: 18px;
      font-weight: 700;
    }
    
    .header-text p {
      font-size: 12px;
      opacity: 0.8;
    }
    
    .search-bar {
      padding: 12px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    
    .search-input {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }
    
    .search-input:focus {
      outline: none;
      border-color: #8b5cf6;
    }
    
    .search-input::placeholder {
      color: #64748b;
    }
    
    .tabs {
      display: flex;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }
    
    .tab:hover {
      background: #334155;
    }
    
    .tab.active {
      border-bottom-color: #8b5cf6;
      color: #8b5cf6;
    }
    
    .content {
      padding: 12px;
      max-height: 350px;
      overflow-y: auto;
    }
    
    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    .price-token {
      font-weight: 600;
    }
    
    .price-value {
      text-align: right;
    }
    
    .price-usd {
      font-weight: 600;
    }
    
    .price-change {
      font-size: 12px;
    }
    
    .price-change.positive {
      color: #10b981;
    }
    
    .price-change.negative {
      color: #ef4444;
    }
    
    .alert-item {
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 3px solid;
    }
    
    .alert-item.critical {
      border-left-color: #ef4444;
    }
    
    .alert-item.high {
      border-left-color: #f59e0b;
    }
    
    .alert-item.medium {
      border-left-color: #3b82f6;
    }
    
    .alert-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .alert-desc {
      font-size: 12px;
      color: #94a3b8;
    }
    
    .alert-time {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    
    .tx-item {
      padding: 10px;
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    .tx-hash {
      font-family: monospace;
      font-size: 12px;
      color: #3b82f6;
      word-break: break-all;
    }
    
    .tx-info {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    
    .tx-status {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    
    .tx-status.success {
      background: #10b981;
      color: white;
    }
    
    .tx-status.failed {
      background: #ef4444;
      color: white;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    
    .stat-card {
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #8b5cf6;
    }
    
    .stat-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
    }
    
    .action-btn {
      padding: 12px;
      background: #1e293b;
      border: none;
      border-radius: 8px;
      color: #e2e8f0;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      background: #334155;
    }
    
    .action-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }
    
    .footer {
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
      text-align: center;
    }
    
    .settings-btn {
      padding: 8px 16px;
      background: #334155;
      border: none;
      border-radius: 6px;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 12px;
    }
    
    .settings-btn:hover {
      background: #475569;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #64748b;
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #334155;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🐯</div>
    <div class="header-text">
      <h1>TigerSmartChain</h1>
      <p>Blockchain Explorer</p>
    </div>
  </div>
  
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="Search address, tx, block, token...">
  </div>
  
  <div class="tabs">
    <div class="tab active" data-tab="prices">Prices</div>
    <div class="tab" data-tab="alerts">Alerts</div>
    <div class="tab" data-tab="transactions">Txs</div>
    <div class="tab" data-tab="stats">Stats</div>
  </div>
  
  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>
  
  <div class="quick-actions">
    <button class="action-btn" data-action="explorer">
      <div class="action-icon">🌐</div>
      <div>Explorer</div>
    </button>
    <button class="action-btn" data-action="dashboard">
      <div class="action-icon">📊</div>
      <div>Dashboard</div>
    </button>
    <button class="action-btn" data-action="settings">
      <div class="action-icon">⚙️</div>
      <div>Settings</div>
    </button>
  </div>
  
  <div class="footer">
    <button class="settings-btn" id="settingsBtn">Open Full Settings</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
