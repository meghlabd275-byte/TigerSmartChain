[package]
name = "tiger-mev"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "MEV detection and analysis for TigerScan"
license = "MIT"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"

# Error handling
thiserror = "1.0"

# Metrics
metrics = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"