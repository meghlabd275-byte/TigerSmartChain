[package]
name = "tiger-receipt"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Receipt for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = true