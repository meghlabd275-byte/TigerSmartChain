[package]
name = "tiger-security"
version = "1.0.0"
edition = "2021"
description = "Security module for TigerSmartChain"

[dependencies]
# Cryptography
sha2 = "0.10"
sha3 = "0.10"
keccak-hash = "0.10"
ecdsa = { version = "0.14", features = ["std"] }
secp256k1 = { version = "0.24", features = ["std"] }
hex = "0.4"
rlp = "0.5"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
lazy_static = "1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "crypto_benches"
harness = false
