[package]
name = "tiger-network"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "P2P networking for TigerSmartChain"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"
rand = "0.8"
tokio = { version = "1.0", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
tiger-crypto = { path = "../crypto" }
tiger-blockchain = { path = "../blockchain" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
