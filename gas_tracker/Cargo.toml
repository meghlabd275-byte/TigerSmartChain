[package]
name = "gas_tracker"
version = "0.1.0"
edition = "2021"
description = "Historical Gas Tracker for TigerScan - Gas analytics with charts"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1.0"
tokio::sync = "1.35"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rustls"]
runtime-async = []

[package.metadata]
docs = "https://docs.tigerscan.io"