[package]
name = "tigerscan-service-http"
version = "1.0.0"
edition = "2021"
description = "Shared JSON-RPC over HTTP serving loop for the TigerScan explorer services"
authors = ["TigerSmartChain Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
tracing = "0.1"

[lib]
name = "tigerscan_service_http"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
