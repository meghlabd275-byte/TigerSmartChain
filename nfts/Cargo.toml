[package]
name = "tiger-nfts"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "NFT tracking for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true