[package]
name = "quantum_crypto"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Post-quantum cryptography for blockchain"

[dependencies]
sha3 = "0.10"
digest = "0.10"
rand = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
