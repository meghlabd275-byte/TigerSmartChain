[package]
name = "tiger-api"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "High-performance API for TigerScan"
license = "MIT"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP Server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Node access
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
metrics = "0.21"

# Rate limiting
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"