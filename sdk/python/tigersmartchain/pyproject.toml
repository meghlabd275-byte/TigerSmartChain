[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigersmartchain"
version = "1.0.0"
description = "Python SDK for the TigerSmartChain blockchain and TigerScan explorer API"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TigerSmartChain" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Key derivation, signing and address derivation.
    "eth-account>=0.10",
    "eth-keys>=0.5",
    "eth-utils>=2.3",
    # Web3 secret storage uses AES-CTR.
    "pycryptodome>=3.19",
    # RPC and REST transport.
    "requests>=2.31",
]

[project.optional-dependencies]
# The scrypt binding is faster than hashlib's, but hashlib's is used when it is
# absent, so this is optional.
fast-kdf = ["scrypt>=0.8"]
test = ["pytest>=7.4"]

[project.urls]
Homepage = "https://tigersmartchain.io"
Repository = "https://github.com/meghlabd275-byte/TigerSmartChain"

[tool.setuptools.packages.find]
include = ["tigersmartchain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
