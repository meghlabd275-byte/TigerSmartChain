[package]
name = "tiger-encryption"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Advanced encryption for TigerScan with AES-256-GCM, ChaCha20-Poly1305, and ECIES"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# Cryptographic libraries
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
poly1305 = "0.7"
sha2 = "0.10"
hmac = "0.12"
ecdh = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "std"] }
rand = "0.8"
base64 = "0.21"
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"
rustls = "0.21"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "encryption"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1