[package]
name = "tiger-pruning"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Pruning for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tiger-state-db = { path = "../state_db" }

[profile.release]
opt-level = 3
lto = true