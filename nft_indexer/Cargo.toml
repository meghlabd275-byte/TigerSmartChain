[package]
name = "nft_indexer"
version = "0.1.0"
edition = "2021"
description = "NFT Metadata Indexer with IPFS/Arweave Support"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "json"] }
thiserror = "1.0"
tracing = "0.1"
url = "2.4"
parking_lot = "0.12"

[lib]
name = "nft_indexer"
path = "src/lib.rs"