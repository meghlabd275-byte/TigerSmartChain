[package]
name = "nft_indexer"
version = "0.1.0"
edition = "2021"
description = "NFT Metadata Indexer with IPFS/Arweave Support"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ethers = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "json"] }
thiserror = "1.0"
tracing = "0.1"
url = "2.4"
ipfs-api = "0.5"
arweave = "0.2"

[lib]
name = "nft_indexer"
path = "src/lib.rs"