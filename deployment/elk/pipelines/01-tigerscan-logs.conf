# Logstash Pipeline Configuration for TigerScan
# Processes blockchain explorer logs with security and parsing

input {
  # Beats input for filebeat
  beats {
    port => 5044
    codec => json
  }
  
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json
    mode => server
    ssl_enable => true
    ssl_key => "/etc/ssl/private/logstash.key"
    ssl_cert => "/etc/ssl/certs/logstash.crt"
    ssl_verify_mode => "force_peer"
  }
  
  # Redis input for queue
  redis {
    host => "${REDIS_HOST}"
    port => 6379
    db => 0
    data_type => list
    key => "tigerscan-logs"
    codec => json
  }
}

filter {
  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601", "UNIX_MS"]
    target => "@timestamp"
    timezone => "UTC"
  }
  
  # Add node metadata
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:production}" }
    add_field => { "service" => "tigerscan" }
  }
  
  # Parse JSON fields
  if [message] and [message] =~ /^{.*}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  # GeoIP enrichment
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      database => "/etc/logstash/GeoLite2-City.mmdb"
    }
  }
  
  # User agent parsing
  if [user_agent] {
    user_agent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # Anonymize sensitive data
  mutate {
    gsub => [
      "password", ".", "****",
      "token", "^[A-Za-z0-9_-]{10,}", "[REDACTED]",
      "api_key", "^[A-Za-z0-9_-]{10,}", "[REDACTED]"
    ]
  }
  
  # Security event classification
  if [level] == "ERROR" and [message] =~ /authentication|fail|denied|unauthorized/ {
    mutate { add_tag => ["security_alert"] }
  }
  
  # Performance monitoring
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "integer" }
    }
  }
  
  # Transaction hash extraction
  if [tx_hash] {
    grok {
      match => { "tx_hash" => "^0x[a-fA-F0-9]{64}$" }
      add_tag => ["blockchain_tx"]
    }
  }
  
  # Block number extraction
  if [block_number] {
    mutate {
      convert => { "block_number" => "integer" }
    }
  }
  
  # Contract address validation
  if [contract_address] {
    grok {
      match => { "contract_address" => "^0x[a-fA-F0-9]{40}$" }
      add_tag => ["contract_interaction"]
    }
  }
}

output {
  # Primary output to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "tigerscan-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    manage_template => true
    template_name => "tigerscan"
    template_overwrite => false
    ssl => true
    user => "${ELASTICSEARCH_USER}"
    password => "${ELASTICSEARCH_PASSWORD}"
  }
  
  # Security alerts to separate index
  if "security_alert" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS}"]
      index => "tigerscan-security-%{+YYYY.MM.dd}"
      document_type => "_doc"
      ssl => true
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
    }
  }
  
  # Performance metrics
  if "blockchain_tx" in [tags] or "contract_interaction" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS}"]
      index => "tigerscan-metrics-%{+YYYY.MM.dd}"
      document_type => "_doc"
      ssl => true
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
    }
  }
  
  # Dead letter queue for failures
  if "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS}"]
      index => "tigerscan-dlq-%{+YYYY.MM.dd}"
      document_type => "_doc"
      ssl => true
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
    }
  }
}