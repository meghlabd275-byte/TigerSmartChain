# HAProxy Configuration for TigerScan
global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor except 127.0.0.0/8
    option  http-server-close
    option  redispatch
    retries 3
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend tigerscan_api
    bind :80
    bind :443 ssl crt /etc/ssl/certs/tigerscan.pem
    mode http
    
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    use_backend tigerscan_backend

backend tigerscan_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    
    server api-1 10.0.1.10:8080 check inter 2000 rise 2 fall 3
    server api-2 10.0.1.11:8080 check inter 2000 rise 2 fall 3
    server api-3 10.0.1.12:8080 check inter 2000 rise 2 fall 3
    
    compression algo gzip
    timeout server 60000