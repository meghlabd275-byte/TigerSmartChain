# TigerSmartChain Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigersmartchain-node
  namespace: tigerscan
  labels:
    app: tigersmartchain
    component: node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tigersmartchain
      component: node
  template:
    metadata:
      labels:
        app: tigersmartchain
        component: node
    spec:
      containers:
      - name: node
        image: tigersmartchain/node:latest
        ports:
        - containerPort: 30303
          name: p2p
        - containerPort: 8545
          name: rpc
        - containerPort: 8546
          name: ws
        - containerPort: 9090
          name: metrics
        env:
        - name: NETWORK
          value: "mainnet"
        - name: RPC_ADDR
          value: "0.0.0.0:8545"
        - name: P2P_ADDR
          value: "0.0.0.0:30303"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8545
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8545
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 8Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tigersmartchain-node-data
      - name: config
        configMap:
          name: tigersmartchain-config
---
apiVersion: v1
kind: Service
metadata:
  name: tigersmartchain-node
  namespace: tigerscan
spec:
  selector:
    app: tigersmartchain
    component: node
  ports:
  - name: p2p
    port: 30303
    protocol: TCP
  - name: rpc
    port: 8545
    protocol: TCP
  - name: ws
    port: 8546
    protocol: TCP
  - name: metrics
    port: 9090
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigersmartchain-api
  namespace: tigerscan
  labels:
    app: tigersmartchain
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tigersmartchain
      component: api
  template:
    metadata:
      labels:
        app: tigersmartchain
        component: api
    spec:
      containers:
      - name: api
        image: tigersmartchain/api:latest
        ports:
        - containerPort: 4000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tigersmartchain-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: tigersmartchain-secrets
              key: redis-url
        - name: NODE_URL
          value: "http://tigersmartchain-node:8545"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      - name: jaeger-agent
        image: jaegertracing/jaeger-agent:latest
        ports:
        - containerPort: 6831
          name: agent
        env:
        - name: REPORTER_TYPE
          value: "grpc"
        - name: COLLECTOR_HOST_PORT
          value: "tigersmartchain-jaeger-collector:14250"
---
apiVersion: v1
kind: Service
metadata:
  name: tigersmartchain-api
  namespace: tigerscan
spec:
  selector:
    app: tigersmartchain
    component: api
  ports:
  - port: 4000
    targetPort: 4000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigersmartchain-indexer
  namespace: tigerscan
  labels:
    app: tigersmartchain
    component: indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tigersmartchain
      component: indexer
  template:
    metadata:
      labels:
        app: tigersmartchain
        component: indexer
    spec:
      containers:
      - name: indexer
        image: tigersmartchain/indexer:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tigersmartchain-secrets
              key: database-url
        - name: NODE_URL
          value: "http://tigersmartchain-node:8545"
        - name: START_BLOCK
          value: "1"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tigersmartchain-indexer
  namespace: tigerscan
spec:
  selector:
    app: tigersmartchain
    component: indexer
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigersmartchain-frontend
  namespace: tigerscan
  labels:
    app: tigersmartchain
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tigersmartchain
      component: frontend
  template:
    metadata:
      labels:
        app: tigersmartchain
        component: frontend
    spec:
      containers:
      - name: frontend
        image: tigersmartchain/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.tigerscan.com"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.tigerscan.com"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tigersmartchain-frontend
  namespace: tigerscan
spec:
  selector:
    app: tigersmartchain
    component: frontend
  ports:
  - port: 80
    targetPort: 3000
  - port: 443
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tigersmartchain-node-data
  namespace: tigerscan
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  storageClassName: ssd
---
apiVersion: v1
kind: Secret
metadata:
  name: tigersmartchain-secrets
  namespace: tigerscan
type: Opaque
stringData:
  database-url: "postgresql://user:pass@postgres:5432/tigerscan"
  redis-url: "redis://redis:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tigersmartchain-config
  namespace: tigerscan
data:
  network.json: |
    {
      "network": "mainnet",
      "chainId": 1,
      "genesisHash": "0xd4e56740f876aef8c010b86a40d5f56725aae22e6e5d5f87db98d964409a1e12"
    }