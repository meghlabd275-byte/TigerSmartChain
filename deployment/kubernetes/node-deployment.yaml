# Kubernetes Deployment for TigerSmartChain Node

apiVersion: v1
kind: Service
metadata:
  name: tigersmartchain-node
  namespace: tigersmartchain
  labels:
    app: tigersmartchain
    component: node
spec:
  type: ClusterIP
  ports:
    - name: p2p
      port: 30303
      targetPort: 30303
    - name: rpc
      port: 8545
      targetPort: 8545
    - name: websocket
      port: 8546
      targetPort: 8546
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: tigersmartchain
    component: node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigersmartchain-node
  namespace: tigersmartchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tigersmartchain
      component: node
  template:
    metadata:
      labels:
        app: tigersmartchain
        component: node
    spec:
      containers:
        - name: node
          image: tigersmartchain/node:latest
          imagePullPolicy: Always
          ports:
            - name: p2p
              containerPort: 30303
            - name: rpc
              containerPort: 8545
            - name: websocket
              containerPort: 8546
            - name: metrics
              containerPort: 9090
          env:
            - name: NETWORK
              value: "mainnet"
            - name: RPC_ADDR
              value: "0.0.0.0:8545"
            - name: P2P_ADDR
              value: "0.0.0.0:30303"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /health
              port: 8545
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8545
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tigersmartchain-data
        - name: config
          configMap:
            name: tigersmartchain-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tigersmartchain-data
  namespace: tigersmartchain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tigersmartchain-config
  namespace: tigersmartchain
data:
  config.json: |
    {
      "network": "mainnet",
      "chainId": 1,
      "genesis": {
        "alloc": {}
      }
    }