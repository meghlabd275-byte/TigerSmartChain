[package]
name = "contract_visualization"
version = "0.1.0"
edition = "2021"
description = "Advanced Contract Visualization - Call Graph, Inheritance Graph, Storage Layout Viewer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
lazy_static = "1.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false

[lib]
name = "contract_visualization"
path = "src/lib.rs"