[package]
name = "tigersmartchain-security"
version = "0.1.0"
edition = "2021"
description = "TigerSmartChain security engine: phishing, scam, honeypot, blacklist, transaction-risk and anomaly detection"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.0"
hex = "0.4"

[lib]
name = "tigersmartchain_security"
path = "src/lib.rs"

[[bin]]
name = "tigersmartchain-security"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
