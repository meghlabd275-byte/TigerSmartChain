[package]
name = "tigersmartchain-security"
version = "0.1.0"
edition = "2021"
description = "TigerSmartChain Security Engine - Phishing, scam, and anomaly detection"

[dependencies]
rustic = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.0"
regex = "1.0"
sha2 = "0.10"
keccak-hash = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
once_cell = "1.0"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"

[[bin]]
name = "tigersmartchain-security"
path = "src/main.rs"

[lib]
name = "tigersmartchain_security"
path = "src/lib.rs"

[features]
default = ["full"]
full = ["phishing", "scam", "honeypot", "blacklist", "transaction-risk", "anomaly"]
phishing = []
scam = []
honeypot = []
blacklist = []
transaction-risk = []
anomaly = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1