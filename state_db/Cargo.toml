[package]
name = "tiger-state-db"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "State DB for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rocksdb = "0.21"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true