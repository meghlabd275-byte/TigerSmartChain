# TigerScan API Documentation

## Overview

TigerScan provides a comprehensive REST API and WebSocket API for accessing blockchain data, tokens, NFTs, and analytics.

## Base URLs

- **Production:** `https://api.tigerscan.io`
- **Testnet:** `https://api-testnet.tigerscan.io`
- **WebSocket:** `wss://api.tigerscan.io/ws`

## Authentication

### API Keys

Include your API key in the request header:

```bash
curl -H "X-API-Key: YOUR_API_KEY" https://api.tigerscan.io/api/v2/tokens
```

### Rate Limits

| Tier | Requests/Minute | Requests/Day |
|------|-----------------|---------------|
| Free | 5 | 1,000 |
| Pro | 100 | 100,000 |
| Enterprise | 1,000 | Unlimited |

## Endpoints

### Blocks

#### Get Block by Number

```bash
GET /api/v2/block/{number}
```

**Response:**
```json
{
  "status": "1",
  "message": "OK",
  "result": {
    "blockNumber": 12345,
    "hash": "0xabc123...",
    "parentHash": "0xparent123...",
    "miner": "0xminer...",
    "gasUsed": 15000000,
    "gasLimit": 30000000,
    "timestamp": 1234567890,
    "transactions": [...]
  }
}
```

#### Get Block by Hash

```bash
GET /api/v2/block/hash/{hash}
```

### Transactions

#### Get Transaction

```bash
GET /api/v2/tx/{hash}
```

**Response:**
```json
{
  "status": "1",
  "message": "OK",
  "result": {
    "hash": "0xabc123...",
    "blockNumber": 12345,
    "from": "0xfrom...",
    "to": "0xto...",
    "value": "1000000000000000000",
    "gasPrice": "20000000000",
    "gasUsed": 21000,
    "status": "1",
    "logs": [...]
  }
}
```

#### Get Transaction Receipt

```bash
GET /api/v2/tx/{hash}/receipt
```

#### Get Internal Transactions

```bash
GET /api/v2/tx/{hash}/internal
```

