## Export API

### Export Transactions

```bash
GET /export?type=transactions&format=json
GET /export?type=transactions&format=csv
```

### Export Token Transfers

```bash
GET /export?type=token_transfers&address=0x123&format=json
```

### Export Blocks

```bash
GET /export?type=blocks&startBlock=10000&endBlock=20000&format=csv
```

## Error Codes

| Code | Description |
|------|------------|
| 1 | Success |
| 0 | Error |
| 400 | Bad Request |
| 401 | Unauthorized |
| 403 | Forbidden |
| 404 | Not Found |
| 429 | Too Many Requests |
| 500 | Internal Server Error |

## Response Format

All responses follow this format:

```json
{
  "status": "1",
  "message": "OK",
  "result": { ... }
}
```

## Batch Requests

```bash
POST /api/v2/batch
Content-Type: application/json

{
  "queries": [
    {"id": "1", "method": "eth_blockNumber", "params": []},
    {"id": "2", "method": "eth_gasPrice", "params": []}
  ]
}
```

## SDK Examples

### JavaScript

```javascript
const Tigerscan = require('tigerscan-sdk');

const client = new Tigerscan({
  apiKey: 'YOUR_API_KEY'
});

const tokens = await client.getTokens();
const token = await client.getToken('0x123...');
const balance = await client.getBalance('0xabc...');
```

### Python

```python
from tigerscan import Tigerscan

client = Tigerscan(api_key='YOUR_API_KEY')
tokens = client.get_tokens()
token = client.get_token('0x123...')
balance = client.get_balance('0xabc...')
```

### Go

```go
import "github.com/tigersmartchain/sdk/go"

client := sdk.NewClient("YOUR_API_KEY")
tokens, err := client.GetTokens()
token, err := client.GetToken("0x123...")
balance, err := client.GetBalance("0xabc...")
```

## WebSocket Events

| Event | Description |
|-------|-------------|
| new_block | New block mined |
| new_transaction | New transaction confirmed |
| pending_transaction | New pending transaction |
| token_transfer | Token transfer occurred |
| nft_transfer | NFT transfer occurred |
| gas_update | Gas price updated |
| price_update | Token price updated |

## Filtering

### Filter Parameters

- `startBlock` - Starting block number
- `endBlock` - Ending block number
- `startTime` - Starting timestamp
- `endTime` - Ending timestamp
- `address` - Contract address

### Example

```bash
GET /api/v2/tokens?startBlock=10000&endBlock=20000
```

## Pagination

All list endpoints support pagination:

```bash
GET /api/v2/tokens?page=1&offset=50
```

- `page` - Page number (default: 1)
- `offset` - Number of results per page (default: 50, max: 10000)

## Contract file_editor/Write

### Read Contract

```bash
GET /api/v2/contract/{address}/read?method=name&params=[]
```

### Write Contract

```bash
POST /api/v2/contract/{address}/write
Content-Type: application/json

{
  "method": "transfer",
  "params": ["0xto...", "1000000"],
  "from": "0xfrom..."
}
```

## Rate Limit Headers

Responses include rate limit information:

```
X-RateLimit-Limit: 100
X-RateLimit-Remaining: 95
X-RateLimit-Reset: 1234567890
```

