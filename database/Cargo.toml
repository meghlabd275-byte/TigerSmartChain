[package]
name = "database"
version = "0.1.0"
edition = "2021"
description = "Complete Database Schema for TigerScan - All tables, migrations, indexes"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
anyhow = "1.0"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rustls"]
runtime-async = []

[package.metadata]
docs = "https://docs.tigerscan.io"