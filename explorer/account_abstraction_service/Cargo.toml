[package]
name = "tigerscan_account_abstraction"
version = "1.0.0"
edition = "2021"
description = "ERC-4337 Account Abstraction Service"
authors = ["TigerSmartChain Team"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ethers = { version = "2.0", features = ["rustls"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[profile.release]
opt-level = 3