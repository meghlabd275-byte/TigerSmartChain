# WebSocket Server Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigerscan-websocket
  namespace: tigerscan
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tigerscan-websocket
  template:
    metadata:
      labels:
        app: tigerscan-websocket
    spec:
      serviceAccountName: tigerscan
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: websocket
        image: tigerscan/websocket:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8546
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tigerscan-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: tigerscan-config
              key: redis-url
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 8546
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8546
          initialDelaySeconds: 5
          periodSeconds: 10
---
# WebSocket Service
apiVersion: v1
kind: Service
metadata:
  name: tigerscan-websocket
  namespace: tigerscan
spec:
  type: ClusterIP
  ports:
  - port: 8546
    targetPort: 8546
    protocol: TCP
  selector:
    app: tigerscan-websocket
---
# HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tigerscan-websocket-hpa
  namespace: tigerscan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tigerscan-websocket
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70