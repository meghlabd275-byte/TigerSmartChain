[package]
name = "tigerscan_price_feed"
version = "1.0.0"
edition = "2021"
description = "Real-time price feed service for TigerScan Explorer"
authors = ["TigerSmartChain Team"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.13"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "tigerscan_price_feed"
path = "src/main.rs"

[lib]
name = "price_feed"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true