[package]
name = "tigerscan_ens"
version = "1.0.0"
edition = "2021"
description = "ENS Resolution Service for TigerScan"
authors = ["TigerSmartChain Team"]

[dependencies]
# Async
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Blockchain
ethers = { version = "2.0", features = ["rustls", "abigen", "full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP
reqwest = { version = "0.11", features = ["json"] }

# Cryptography
sha2 = "0.10"

# Synchronization
parking_lot = "0.12"

[lib]
name = "tigerscan_ens"
path = "src/lib.rs"

[[bin]]
name = "tigerscan-ens"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"