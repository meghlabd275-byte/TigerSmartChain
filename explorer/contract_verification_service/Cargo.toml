[package]
name = "contract_verification_service"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Production Contract Verification Service with Solidity/Vyper compilation"

[dependencies]
ethers = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.0"
reqwest = { version = "0.11", features = ["json"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres"] }
parking_lot = "0.12"
once_cell = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.8"
base64 = "0.21"
encoding_rs = "0.8"
tiny_http = "0.12"
futures = "0.3"
async-trait = "0.1"
url = "2.0"
glob = "0.3"
tempfile = "3.0"
walkdir = "2.0"
zip = "0.6"
aes-gcm = "0.10"

[lib]
name = "contract_verification_service"
path = "src/lib.rs"

[[bin]]
name = "contract_verification_service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"