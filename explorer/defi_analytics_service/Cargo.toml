[package]
name = "tigerscan_defi_analytics"
version = "1.0.0"
edition = "2021"
description = "DeFi Analytics Service for TigerScan - TVL, lending rates, pool analytics"
authors = ["TigerSmartChain Team"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
ethers = { version = "2.0", features = ["rustls", "abigen"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1