[package]
name = "sdk_generator_service"
version = "1.0.0"
edition = "2021"
description = "SDK Generator: Python, Go, Rust, Java SDKs"
[dependencies]
tiny_http = "0.12"
tigerscan-service-http = { path = "../../tigerscan-service-http" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"

chrono = { version = "0.4", features = ["serde"] }
[lib]
name = "sdk_generator_service"
path = "src/lib.rs"
[[bin]]
name = "sdk_generator_service"
path = "src/main.rs"
[profile.release]
opt-level = 3