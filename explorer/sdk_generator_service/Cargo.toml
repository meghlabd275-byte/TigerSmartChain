[package]
name = "sdk_generator_service"
version = "1.0.0"
edition = "2021"
description = "SDK Generator: Python, Go, Rust, Java SDKs"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
handlebars = "4.7"

[lib]
name = "sdk_generator_service"
path = "src/lib.rs"
[[bin]]
name = "sdk_generator_service"
path = "src/main.rs"
[profile.release]
opt-level = 3