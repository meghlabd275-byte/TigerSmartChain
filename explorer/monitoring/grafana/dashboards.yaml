# Grafana Dashboard Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  tigerscan-api.json: |
    {
      "dashboard": {
        "title": "TigerScan API Server",
        "tags": ["tigerscan", "api"],
        "timezone": "browser",
        "refresh": "30s",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "{{method}} {{path}}"
              }
            ]
          },
          {
            "title": "Response Time (p95, p99)",
            "type": "graph",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "p95"
              },
              {
                "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "p99"
              }
            ]
          },
          {
            "title": "Error Rate",
            "type": "graph",
            "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(http_requests_errors_total[5m])",
                "legendFormat": "Errors"
              }
            ]
          },
          {
            "title": "Active Connections",
            "type": "graph",
            "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "http_active_connections",
                "legendFormat": "Active"
              }
            ]
          },
          {
            "title": "CPU Usage",
            "type": "graph",
            "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "container_cpu_usage_seconds_total{pod=~\"tigerscan-api.*\"}",
                "legendFormat": "CPU"
              }
            ]
          },
          {
            "title": "Memory Usage",
            "type": "graph",
            "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "container_memory_usage_bytes{pod=~\"tigerscan-api.*\"}",
                "legendFormat": "Memory"
              }
            ]
          }
        ]
      }
    }
  tigerscan-websocket.json: |
    {
      "dashboard": {
        "title": "TigerScan WebSocket",
        "tags": ["tigerscan", "websocket"],
        "timezone": "browser",
        "refresh": "30s",
        "panels": [
          {
            "title": "Connected Clients",
            "type": "stat",
            "targets": [
              {"expr": "ws_connected_clients", "legendFormat": "Clients"}
            ]
          },
          {
            "title": "Messages/sec",
            "type": "graph",
            "targets": [
              {"expr": "rate(ws_messages_total[5m])", "legendFormat": "Messages"}
            ]
          },
          {
            "title": "Subscription Count",
            "type": "stat",
            "targets": [
              {"expr": "ws_active_subscriptions", "legendFormat": "Subscriptions"}
            ]
          }
        ]
      }
    }
  tigerscan-services.json: |
    {
      "dashboard": {
        "title": "TigerScan Services",
        "tags": ["tigerscan", "services"],
        "timezone": "browser",
        "refresh": "30s",
        "panels": [
          {
            "title": "Token Service - Requests",
            "type": "graph",
            "targets": [
              {"expr": "rate(token_service_requests_total[5m])", "legendFormat": "Requests"}
            ]
          },
          {
            "title": "NFT Service - Metadata Fetches",
            "type": "graph",
            "targets": [
              {"expr": "rate(nft_metadata_fetches_total[5m])", "legendFormat": "Fetches"}
            ]
          },
          {
            "title": "DeFi Service - TVL Updates",
            "type": "graph",
            "targets": [
              {"expr": "rate(defi_tvl_updates_total[5m])", "legendFormat": "Updates"}
            ]
          },
          {
            "title": "Security Service - Alerts",
            "type": "graph",
            "targets": [
              {"expr": "rate(security_alerts_total[5m])", "legendFormat": "Alerts"}
            ]
          }
        ]
      }
    }
  tigerscan-database.json: |
    {
      "dashboard": {
        "title": "TigerScan Database",
        "tags": ["tigerscan", "database"],
        "timezone": "browser",
        "refresh": "30s",
        "panels": [
          {
            "title": "PostgreSQL Connections",
            "type": "graph",
            "targets": [
              {"expr": "pg_stat_database_connections", "legendFormat": "Connections"}
            ]
          },
          {
            "title": "Query Duration (p95)",
            "type": "graph",
            "targets": [
              {"expr": "histogram_quantile(0.95, rate(pg_stat_database_query_duration_seconds_bucket[5m]))", "legendFormat": "p95"}
            ]
          },
          {
            "title": "Cache Hit Ratio",
            "type": "gauge",
            "targets": [
              {"expr": "pg_stat_database_cache_hit_ratio", "legendFormat": "Hit Ratio"}
            ]
          },
          {
            "title": "Redis Memory",
            "type": "graph",
            "targets": [
              {"expr": "redis_memory_used_bytes", "legendFormat": "Used"}
            ]
          }
        ]
      }
    }

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsUser: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:10.1.0
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana.tigerscan.io"
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "true"
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: admin-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_AUTH_GITHUB_ENABLED
          value: "true"
        - name: GF_AUTH_GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: github-client-id
        - name: GF_AUTH_GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: github-client-secret
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: grafana

---
# Grafana Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - grafana.tigerscan.io
    secretName: grafana-tls
  rules:
  - host: grafana.tigerscan.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000