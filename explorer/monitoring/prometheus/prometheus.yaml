# Prometheus Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'tigerscan'
        environment: 'production'
    
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    
    rule_files:
      - '/etc/prometheus/rules/*.yml'
    
    scrape_configs:
    # Prometheus self-monitoring
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
    
    # API Server metrics
    - job_name: 'tigerscan-api'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tigerscan
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'tigerscan-api'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
    
    # WebSocket metrics
    - job_name: 'tigerscan-websocket'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tigerscan
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'tigerscan-websocket'
        action: keep
    
    # Token Service metrics
    - job_name: 'tigerscan-token-service'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tigerscan
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'tigerscan-token'
        action: keep
    
    # NFT Service metrics
    - job_name: 'tigerscan-nft-service'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tigerscan
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'tigerscan-nft'
        action: keep
    
    # DeFi Service metrics
    - job_name: 'tigerscan-defi-service'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tigerscan
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'tigerscan-defi'
        action: keep
    
    # Security Service metrics
    - job_name: 'tigerscan-security-service'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - tigerscan
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'tigerscan-security'
        action: keep
    
    # Node Exporter for infrastructure metrics
    - job_name: 'node-exporter'
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - source_labels: [__address]
        regex: '(.*):10250'
        replacement: '${1}:9100'
        target_label: __address_
    
    # PostgreSQL metrics
    - job_name: 'postgres-exporter'
      static_configs:
      - targets: ['tigerscan-postgres-exporter:9187']
    
    # Redis metrics
    - job_name: 'redis-exporter'
      static_configs:
      - targets: ['tigerscan-redis-exporter:9121']

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=30d'
        - '--storage.tsdb.retention.size=100GB'
        - '--web.enable-lifecycle'
        - '--web.enable-admin-api'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir:
          sizeLimit: 100Gi

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus