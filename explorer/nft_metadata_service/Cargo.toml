[package]
name = "tigerscan_nft_metadata"
version = "1.0.0"
edition = "2021"
description = "NFT Metadata Service for TigerScan - IPFS/Arweave, floor prices, rarity"
authors = ["TigerSmartChain Team"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
ethers = { version = "2.0", features = ["rustls"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "rustls"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
base64 = "0.21"
ipfs-api = "0.3"

[lib]
name = "tigerscan_nft_metadata"
path = "src/lib.rs"

[[bin]]
name = "nft_metadata_service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1