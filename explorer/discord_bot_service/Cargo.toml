[package]
name = "discord_bot_service"
version = "1.0.0"
edition = "2021"
description = "Discord Bot for Notifications and Commands"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.11", features = ["json"] }

[lib]
name = "discord_bot_service"
path = "src/lib.rs"
[[bin]]
name = "discord_bot_service"
path = "src/main.rs"
[profile.release]
opt-level = 3