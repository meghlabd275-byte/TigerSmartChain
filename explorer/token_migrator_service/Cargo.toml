[package]
name = "token_migrator_service"
version = "1.0.0"
edition = "2021"
description = "Token Migrator and Airdrop Finder Service"
[dependencies]
ethers = { version = "2.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[lib]
name = "token_migrator_service"
path = "src/lib.rs"
[[bin]]
name = "token_migrator_service"
path = "src/main.rs"

[profile.release]
opt-level = 3