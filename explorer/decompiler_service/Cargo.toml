[package]
name = "tigerscan_decompiler"
version = "1.0.0"
edition = "2021"
description = "Smart Contract Decompiler for TigerScan - Bytecode to source analysis"
authors = ["TigerSmartChain Team"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ethers = { version = "2.0", features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
regex = "1.10"
hex = "0.4"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true