[package]
name = "crosschain_service"
version = "1.0.0"
edition = "2021"
description = "Cross-chain Bridge Tracking & Portfolio"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "crosschain_service"
path = "src/lib.rs"
[[bin]]
name = "crosschain_service"
path = "src/main.rs"
[profile.release]
opt-level = 3