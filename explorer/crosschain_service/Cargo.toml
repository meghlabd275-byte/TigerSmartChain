[package]
name = "crosschain_service"
version = "1.0.0"
edition = "2021"
description = "Cross-chain Bridge Tracking & Portfolio"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sha3 = "0.10"
hex = "0.4"
tracing = "0.1"

[lib]
name = "crosschain_service"
path = "src/lib.rs"
[[bin]]
name = "crosschain_service"
path = "src/main.rs"
[profile.release]
opt-level = 3