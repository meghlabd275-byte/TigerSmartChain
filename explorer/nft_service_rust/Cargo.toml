[package]
name = "tigerscan-nft-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerSmartChain"]
description = "High-performance NFT metadata and rarity analysis service"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "migrate"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IPFS support
ipfs-api = "0.6"

# HTTP server
axum = "0.6"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.4", features = ["cors", "trace"] }

# Metrics
prometheus = "0.13"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
regex = "1.10"
lazy_static = "1.4"
base64 = "0.21"

# Image processing
image = "0.24"

# Async traits
async-trait = "0.1"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rt-multi-thread"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"