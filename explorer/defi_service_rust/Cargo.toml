[package]
name = "tigerscan-defi-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerSmartChain"]
description = "High-performance DeFi analytics service for TVL, pools, lending rates"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1.19"
regex = "1.10"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1