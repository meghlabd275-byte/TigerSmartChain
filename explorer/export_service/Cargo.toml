[package]
name = "export_service"
version = "1.0.0"
edition = "2021"
description = "Bulk Export Service: CSV, Excel, Historical Data"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
csv = "1.3"
calamine = "0.24"

[lib]
name = "export_service"
path = "src/lib.rs"
[[bin]]
name = "export_service"
path = "src/main.rs"
[profile.release]
opt-level = 3