[package]
name = "export_service"
version = "1.0.0"
edition = "2021"
description = "Bulk Export Service: CSV, Excel, Historical Data"
[dependencies]
tiny_http = "0.12"
tigerscan-service-http = { path = "../../tigerscan-service-http" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
csv = "1.3"
calamine = "0.24"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
[lib]
name = "export_service"
path = "src/lib.rs"
[[bin]]
name = "export_service"
path = "src/main.rs"
[profile.release]
opt-level = 3