[package]
name = "export_service"
version = "1.0.0"
edition = "2021"
description = "Bulk Export Service: CSV, Excel, Historical Data"
[dependencies]
tiny_http = "0.12"
tigerscan-service-http = { path = "../../tigerscan-service-http" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
csv = "1.3"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
futures = "0.3"
rust_xlsxwriter = "0.64"
arrow = "53"
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"] }

chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
[lib]
name = "export_service"
path = "src/lib.rs"
[[bin]]
name = "export_service"
path = "src/main.rs"
[profile.release]
opt-level = 3