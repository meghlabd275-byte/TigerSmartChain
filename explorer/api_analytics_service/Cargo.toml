[package]
name = "api_analytics_service"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "API Analytics Dashboard Service"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "api_analytics_service"
path = "src/lib.rs"

[[bin]]
name = "api_analytics_service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true