[package]
name = "tigerscan_multisig"
version = "1.0.0"
edition = "2021"
description = "Multisig Detection Service"
authors = ["TigerSmartChain Team"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ethers = { version = "2.0", features = ["rustls"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[profile.release]
opt-level = 3