[package]
name = "tigerscan-token-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerSmartChain"]
description = "High-performance token price feed and holder tracking service"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "migrate"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Configuration
config = "0.14"
directories = "5.0"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
regex = "1.10"
lazy_static = "1.4"

# Cryptography for secure price signing
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"

# Metrics
prometheus = "0.13"
metrics = "0.21"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rt-multi-thread"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"