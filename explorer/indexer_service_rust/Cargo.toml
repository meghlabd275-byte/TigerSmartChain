[package]
name = "tigerscan-indexer"
version = "1.0.0"
edition = "2021"
description = "High-performance blockchain indexer with trace support"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
anyhow = "1.0"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true