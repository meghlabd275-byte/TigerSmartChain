[package]
name = "tiger-evm"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "EVM interpreter for TigerSmartChain"
license = "MIT"

[dependencies]
tiger-crypto = { path = "../crypto" }
tiger-precompile = { path = "../precompile" }
tiger-state = { path = "../state" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"
hex = "0.4.3"
ethnum = "1"
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery"] }

[profile.release]
opt-level = 3
lto = true
