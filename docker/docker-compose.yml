# Docker Compose for TigerSmartChain Full Stack

services:
  # ============================================
  # BLOCKCHAIN NODE
  # ============================================
  node:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: tigersmartchain-node
    ports:
      - "30303:30303"  # P2P
      - "8545:8545"     # RPC
      - "8546:8546"     # WebSocket
      - "9090:9090"     # Metrics
    volumes:
      - node-data:/app/data
      - ./config:/app/config:ro
    environment:
      - NETWORK=mainnet
      - RPC_ADDR=0.0.0.0:8545
      - P2P_ADDR=0.0.0.0:30303
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # POSTGRES DATABASE
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: tigersmartchain-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./explorer/databases/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      - POSTGRES_DB=tigerscan
      - POSTGRES_USER=tigerscan
      - POSTGRES_PASSWORD=tigerscan_password_secure
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigerscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS CACHE
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tigersmartchain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # EXPLORER API
  # ============================================
  explorer-api:
    build:
      context: ./explorer/apps/api-server
      dockerfile: Dockerfile
    container_name: tigersmartchain-explorer-api
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://tigerscan:tigerscan_password_secure@postgres:5432/tigerscan
      - REDIS_URL=redis://redis:6379
      - NODE_URL=http://node:8545
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # INDEXER
  # ============================================
  indexer:
    build:
      context: ./explorer/apps/indexer
      dockerfile: Dockerfile
    container_name: tigersmartchain-indexer
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://tigerscan:tigerscan_password_secure@postgres:5432/tigerscan
      - NODE_URL=http://node:8545
      - START_BLOCK=1
    restart: unless-stopped

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    build:
      context: ./explorer/frontend
      dockerfile: Dockerfile
    container_name: tigersmartchain-frontend
    ports:
      - "3000:3000"
    depends_on:
      - explorer-api
    environment:
      - NEXT_PUBLIC_API_URL=http://explorer-api:4000
      - NEXT_PUBLIC_WS_URL=ws://explorer-api:4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # ADMIN PANEL
  # ============================================
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tigersmartchain-admin
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://tigerscan:tigerscan_password_secure@postgres:5432/tigerscan
      - JWT_SECRET=your-secret-key-change-in-production
    restart: unless-stopped

  # ============================================
  # MONITORING
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: tigersmartchain-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: tigersmartchain-grafana
    ports:
      - "3002:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped

# ============================================
# VOLUMES
# ============================================
volumes:
  node-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

# ============================================
# NETWORKS
# ============================================
networks:
  default:
    name: tigersmartchain-network