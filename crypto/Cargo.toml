[package]
name = "tiger-crypto"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Crypto for TigerScan"
license = "MIT"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
