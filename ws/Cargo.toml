[package]
name = "tiger-ws"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "WebSocket for TigerScan"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true