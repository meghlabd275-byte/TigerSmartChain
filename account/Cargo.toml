[package]
name = "tiger-account"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Account for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = true