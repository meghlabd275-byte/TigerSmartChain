[package]
name = "advanced_search"
version = "0.1.0"
edition = "2021"
description = "Advanced Search - Bytecode Search, Event Log Search, Fuzzy Search"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fuzzy-matcher = "0.3"
regex = "1.8"
lazy_static = "1.4"
bloom = "0.3"
ahash = "0.7"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false

[lib]
name = "advanced_search"
path = "src/lib.rs"