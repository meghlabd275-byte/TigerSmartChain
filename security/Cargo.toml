[package]
name = "tiger-security"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Advanced security module for TigerScan - AES-256-GCM, ChaCha20, Argon2, Rate Limiting, DDoS Protection"
license = "MIT"

[dependencies]
# Cryptography - AES-256-GCM
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
rsa = "0.8"
base64 = "0.21"
hex = "0.4"
digest = "0.10"

# Argon2 password hashing
argon2 = "0.5"

# ChaCha20-Poly1305
chacha20poly1305 = "0.10"

# Ed25519 signatures
ed25519-dalek = "2"

# GetRandom for secure random
getrandom = "0.2"

# JWT
jsonwebtoken = "9"
ring = "0.17"

# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"

# Redis
redis = { version = "0.24", features = ["tokio-comp"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP
reqwest = { version = "0.11", features = ["json"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Regex
regex = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Constant-time comparison
subtle = "2"

# Hashing
blake3 = "1"

# Data structures
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"