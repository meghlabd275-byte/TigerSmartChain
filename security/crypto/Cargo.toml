[package]
name = "tigersmartchain-crypto"
version = "0.1.0"
edition = "2021"
authors = ["TigerSmartChain Team"]
description = "Cryptographic primitives for TigerSmartChain"

[dependencies]
# Cryptography
k256 = { version = "0.13", features = ["ecdsa", "der"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake3 = "1.5"
sha2 = "0.10"
sha3 = "0.10"
keccak-hash = "0.10"
hex = "0.4"
base64 = "0.21"
zeroize = { version = "1.7", features = ["derive"] }

# Utilities
thiserror = "1.0"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "crypto_benches"
harness = false