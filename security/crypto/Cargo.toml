[package]
name = "tigersmartchain-crypto"
version = "0.1.0"
edition = "2021"
authors = ["TigerSmartChain Team"]
description = "Cryptographic primitives for TigerSmartChain"

[dependencies]
# Signatures
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

# Hashing
blake3 = "1.5"
sha2 = "0.10"
sha3 = "0.10"
keccak-hash = "0.10"
ripemd = "0.1"

# Authenticated encryption
aes-gcm = "0.10"

# Key derivation
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
bip39 = { version = "2.0", features = ["rand"] }

# Encoding and hygiene
hex = "0.4"
base64 = "0.21"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# Utilities
thiserror = "1.0"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
