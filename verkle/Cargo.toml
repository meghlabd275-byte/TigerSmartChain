[package]
name = "tiger-verkle"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "High-performance Verkle Tree implementation for TigerScan"
license = "MIT"

[dependencies]
# Cryptography
sha3 = "0.10"
keccak-hash = "0.10"
digest = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.7"
blake2b_simd = "1.0"
log = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "verkle_bench"
harness = false

[profile.release]
opt-level = 3
lto = true