[package]
name = "tiger-verkle"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "High-performance Verkle Tree implementation for TigerScan"
license = "MIT"

[dependencies]
keccak-hash = "0.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "verkle_bench"
harness = false

[profile.release]
opt-level = 3
lto = true