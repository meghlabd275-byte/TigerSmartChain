[package]
name = "tiger-websocket-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "WebSocket Service for TigerScan real-time updates"
license = "MIT"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"
tungstenite = "0.21"

# HTTP/WebSocket client
reqwest = { version = "0.11", features = ["json"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
metrics = "0.21"

# UUID for connection IDs
uuid = { version = "1.0", features = ["v4"] }

# Parking lot for synchronization
parking_lot = "0.12"

[lib]
name = "tiger_websocket_service"
path = "src/lib.rs"

[[bin]]
name = "tiger-websocket-service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"