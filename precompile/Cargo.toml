[package]
name = "tiger-precompile"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Precompiles for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"
sha2 = "0.10"
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery", "rand"] }
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"

[profile.release]
opt-level = 3
lto = true