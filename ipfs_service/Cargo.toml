[package]
name = "tiger-ipfs-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "IPFS Service for TigerScan"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"
blake3 = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true