[package]
name = "tiger-load-balancer"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "Load balancer for TigerScan: seven real selection algorithms with health checking"
license = "MIT"

[lib]
name = "tiger_load_balancer"
path = "src/lib.rs"

[[bin]]
name = "tiger-load-balancer"
path = "src/main.rs"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
