# TigerScan Production Docker Compose
# Complete blockchain explorer infrastructure

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tigerscan-postgres
    environment:
      POSTGRES_USER: tigerscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: tigerscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./explorer/databases/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigerscan"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tigerscan-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tigerscan-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tigerscan-network
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: tigerscan-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=tigerscan
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tigerscan-network
    restart: unless-stopped

  # Blockchain Node (Geth)
  node:
    image: ethereum/client-go:stable
    container_name: tigerscan-node
    command: >
      --主网 --http --http.addr=0.0.0.0 --http.port=8545 
      --http.api=eth,net,web3,debug,txpool 
      --ws --ws.addr=0.0.0.0 --ws.port=8546 
      --ws.api=eth,net,web3,debug,txpool 
      --http.corsdomain="*" 
      --ws.origins="*" 
      --cache=2048 
      --maxpeers=100
    volumes:
      - node_data:/geth
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
      - "30303:30303/udp"
    networks:
      - tigerscan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Indexer Service
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    container_name: tigerscan-indexer
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tigerscan
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=tigerscan
      - INDEXER_RPC_URL=http://node:8545
      - INDEXER_WS_URL=ws://node:8546
      - INDEXER_CHAIN_ID=9001
      - INDEXER_BATCH_SIZE=100
      - INDEXER_WORKERS=4
      - INDEXER_CONFIRMATION_DEPTH=12
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_started
    networks:
      - tigerscan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tigerscan-api
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tigerscan
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=tigerscan
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tigerscan-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./explorer/frontend
      dockerfile: Dockerfile
    container_name: tigerscan-frontend
    environment:
      - API_URL=http://api:8080
      - NEXT_PUBLIC_CHAIN_ID=9001
      - NEXT_PUBLIC_CHAIN_NAME=TigerSmartChain
      - NEXT_PUBLIC_TOKEN_SYMBOL=TGR
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - tigerscan-network
    restart: unless-stopped

  # WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.ws
    container_name: tigerscan-websocket
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WS_PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - tigerscan-network
    restart: unless-stopped

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: tigerscan-prometheus
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - tigerscan-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: tigerscan-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - tigerscan-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tigerscan-nginx
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api
    networks:
      - tigerscan-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  node_data:
  prometheus_data:
  grafana_data:

networks:
  tigerscan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16