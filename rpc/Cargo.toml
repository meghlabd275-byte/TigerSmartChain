[package]
name = "tiger-rpc"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "RPC for TigerScan"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true