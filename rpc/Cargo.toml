[package]
name = "tiger-rpc"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "RPC client for TigerScan with Ethereum node connection"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"

# HTTP client for RPC calls
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
async-trait = "0.1"

# Utilities
url = "2.4"
hex = "0.4"
base64 = "0.21"
ethabi = "18"
ruint = "1"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1