[package]
name = "tiger-node"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "TigerSmartChain Blockchain Node"
license = "MIT"

[[bin]]
name = "tigersmartchaind"
path = "src/main.rs"

[dependencies]
# Embedded key/value store: a copy-on-write B-tree, so a block flush writes
# only what changed rather than the whole chain.
redb = "4.5"
# Blockchain core - use existing TigerSmartChain crates
tiger-blockchain = { path = "../blockchain" }
tiger-state = { path = "../state" }
tiger-evm = { path = "../evm" }
tiger-crypto = { path = "../crypto" }

# Consensus
tiger-consensus = { path = "../consensus" }

# Network
tiger-network = { path = "../network" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Hex encoding for the trace and JSON-RPC layers.
hex = "0.4"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# WebSocket JSON-RPC, which is where eth_subscribe lives
tokio-tungstenite = "0.21"
futures = "0.3"

[features]
default = []
test = ["tokio/rt-multi-thread"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1