[package]
name = "tiger-dex"
version = "1.0.0"
edition = "2021"
authors = ["TigerScan Team"]
description = "High-performance DEX module for TigerScan - PancakeSwap, Uniswap integration"
license = "MIT"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1.0"

# URL
url = "2"

# Caching
lru = "0.12"

# Hashing
ahash = "0.7"

# Metrics
metrics = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"