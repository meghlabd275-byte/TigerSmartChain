[package]
name = "graphql_api"
version = "0.1.0"
edition = "2021"
description = "Complete GraphQL API for TigerScan - Full schema with subscriptions"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-graphql = "6.0"
async-graphql-warp = "6.0"
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "json",
    "chrono",
    "uuid",
    "bigdecimal",
] }
futures-util = "0.3"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
bigdecimal = { version = "0.3", features = ["serde"] }
contract_verifier_advanced = { path = "../contract_verifier_advanced" }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rt-multi-thread"]
runtime-async = []

[package.metadata]
docs = "https://docs.tigerscan.io"