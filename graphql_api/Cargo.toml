[package]
name = "graphql_api"
version = "0.1.0"
edition = "2021"
description = "Complete GraphQL API for TigerScan - Full schema with subscriptions"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-graphql = "6.0"
async-graphql-warp = "6.0"
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rustls"]
runtime-async = []

[package.metadata]
docs = "https://docs.tigerscan.io"